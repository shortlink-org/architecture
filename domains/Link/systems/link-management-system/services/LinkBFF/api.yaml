openapi: 3.0.1
info:
  version: 0.1.0
  title: ShortLink API (LINK BFF)
  description: |
    ShortLink API for managing and retrieving short links.
  contact:
    email: support@shortlink.best
    name: ShortLink repository
    url: https://github.com/shortlink-org/shortlink/issues
  license:
    name: MIT
    url: http://www.opensource.org/licenses/MIT
servers:
  - url: http://127.0.0.1:7070/api
    description: Local server
  - url: https://shortlink.best/api
    description: Production server
  - url: https://shortlink.best/mock
    description: Mock server
paths:
  /links:
    get:
      summary: List links
      description: Retrieve a list of all short links with pagination.
      operationId: getLinks
      tags:
        - Link
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
        - in: query
          name: filter
          schema:
            $ref: '#/components/schemas/LinkFilter'
      responses:
        '200':
          $ref: '#/components/responses/PaginatedLinksResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Add link
      description: Add a new short link.
      operationId: addLink
      tags:
        - Link
      requestBody:
        $ref: '#/components/requestBodies/AddLinkRequest'
      responses:
        '201':
          $ref: '#/components/responses/LinkCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
    put:
      summary: Update links
      description: Update existing links based on a filter. Updates a single link if the 'id' field is specified in the filter.
      operationId: updateLinks
      tags:
        - Link
      requestBody:
        $ref: '#/components/requestBodies/UpdateLinkRequest'
      responses:
        '200':
          $ref: '#/components/responses/LinksUpdated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /links/{hash}:
    get:
      summary: Get link
      description: Retrieve a specific link by its hash.
      operationId: getLink
      tags:
        - Link
      parameters:
        - $ref: '#/components/parameters/LinkHashParam'
      responses:
        '200':
          $ref: '#/components/responses/LinkDetails'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete link
      description: Delete a specific link by its hash.
      operationId: deleteLink
      tags:
        - Link
      parameters:
        - $ref: '#/components/parameters/LinkHashParam'
      responses:
        '204':
          $ref: '#/components/responses/LinkDeleted'
        '404':
          $ref: '#/components/responses/NotFound'
  /sitemap:
    post:
      summary: Add Sitemap
      description: Add a new sitemap.
      operationId: addSitemap
      tags:
        - Sitemap
      requestBody:
        $ref: '#/components/requestBodies/SitemapRequest'
      responses:
        '200':
          $ref: '#/components/responses/SitemapProcessed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  parameters:
    LimitParam:
      in: query
      name: limit
      description: The number of items to return per page.
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100
    CursorParam:
      in: query
      name: cursor
      schema:
        type: string
      description: A cursor for use in pagination. This is the ID of the last item in the previous page.
    LinkHashParam:
      name: hash
      in: path
      required: true
      schema:
        type: string
        pattern: ^[0-9a-fA-F]{32}$
      description: Unique hash of the link.
  schemas:
    LinkFilter:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the link. Use this to update a specific link.
        urlContains:
          type: string
          description: Filter links that contain this text in their URL.
      additionalProperties: false
    Link:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: The URL of the link.
        hash:
          type: string
          description: Unique hash, used as the short link.
        describe:
          type: string
          description: Description of the link.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the link was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the link was last updated.
        allowed_emails:
          type: array
          items:
            type: string
            format: email
          description: List of allowed email addresses for private link access. Empty array means public link.
      required:
        - url
        - hash
        - describe
        - created_at
        - updated_at
        - allowed_emails
    ErrorResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            type: string
          description: An array of human-readable messages providing more details about the error.
    AddLink:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: The URL of the link.
        describe:
          type: string
          description: Description of the link.
        allowed_emails:
          type: array
          items:
            type: string
            format: email
          description: List of allowed email addresses for private link access. Empty array means public link.
          maxItems: 100
      required:
        - url
      example:
        url: https://www.google.com
        describe: Search engine
        allowed_emails: []
  responses:
    PaginatedLinksResponse:
      description: A page of links with pagination details.
      content:
        application/json:
          schema:
            type: object
            properties:
              links:
                type: array
                items:
                  $ref: '#/components/schemas/Link'
              next_cursor:
                type: string
                description: A cursor to be used to fetch the next page of results.
            required:
              - links
              - next_cursor
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    LinksUpdated:
      description: Links updated successfully.
      content:
        application/json:
          schema:
            type: object
            properties:
              updatedCount:
                type: integer
                description: The number of links updated.
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    LinkCreated:
      description: Link created successfully.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Link'
    LinkDetails:
      description: Details of the link.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Link'
    LinkDeleted:
      description: Link deleted successfully.
    SitemapProcessed:
      description: Sitemap processed successfully.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: A confirmation message.
  requestBodies:
    UpdateLinkRequest:
      description: Request body for updating a link.
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              filter:
                $ref: '#/components/schemas/LinkFilter'
              link:
                $ref: '#/components/schemas/Link'
    AddLinkRequest:
      description: Request body for adding a new link.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AddLink'
          examples:
            googleExample:
              summary: Google Example
              value:
                url: https://www.google.com
                describe: Google Search Engine
            wikipediaExample:
              summary: Wikipedia Example
              value:
                url: https://www.wikipedia.org
                describe: Free Online Encyclopedia
            youtubeExample:
              summary: YouTube Example
              value:
                url: https://www.youtube.com
                describe: Video Sharing Platform
    SitemapRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              url:
                type: string
                format: uri
                description: The URL of the sitemap.
            required:
              - url
            examples:
              habrQuestion:
                summary: Habr Question
                value:
                  url: https://qna.habr.com/sitemap/questions.xml
              williamsPublishing:
                summary: Williams Publishing
                value:
                  url: http://www.williamspublishing.com/sitemap.xml
              habrTags:
                summary: Habr Tags
                value:
                  url: https://qna.habr.com/sitemap/tags.xml
              piter:
                summary: Piter
                value:
                  url: https://www.piter.com/sitemap.xml
              mannIvanovFerberBooks:
                summary: MIF Books
                value:
                  url: https://www.mann-ivanov-ferber.ru/sitemap/books.xml
              mannIvanovFerberAuthors:
                summary: MIF Authors
                value:
                  url: https://www.mann-ivanov-ferber.ru/sitemap/authors.xml
x-json-schema-faker:
  locale: en
  min-items: 2
  max-items: 5
  resolve-json-path: true
  useExamplesValue: true
