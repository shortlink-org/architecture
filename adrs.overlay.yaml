# Catalog-owned metadata for architecture decision records.
#
# The decisions themselves live in the source repositories and are not edited here — every
# adrs/**/index.mdx is generated from upstream by scripts/sync-adrs.mjs. This file holds the part
# upstream cannot: where each decision belongs in the catalog, and how it ties to the resources
# the catalog documents.
#
#   source    <owner/repo>:<path to the upstream .md>
#   origin    'catalog' instead of a source, for a decision made in this repository
#   location  the adrs/ directory the generated file goes into
#
# Everything else is standard EventCatalog ADR frontmatter.

