name: Upstream drift

# The catalog carries derived copies of what lives in the source repositories: protobuf and OpenAPI
# schemas, and decision records rewritten from upstream ADRs. This checks both still match their
# source. It deliberately does NOT run on every pull request: upstream moving is not a reason to
# fail an unrelated PR — only a reason to know about it.
on:
  schedule:
    # 06:00 UTC daily
    - cron: '0 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/sync-schemas.mjs'
      - 'scripts/sync-adrs.mjs'
      - 'scripts/sync-docs.mjs'
      - 'adrs.overlay.yaml'
      - '**/*.proto'
      - '**/api.yaml'
      - '**/adrs/**/index.mdx'

jobs:
  schemas:
    name: Compare catalog schemas with upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check for drift
        run: npm run check:schemas

  adrs:
    name: Compare decision records with upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for drift
        run: npm run check:adrs
        env:
          # Only lifts the unauthenticated GitHub API rate limit — every repository read is public.
          GITHUB_TOKEN: ${{ github.token }}

  docs:
    name: Compare resource pages with their sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for drift
        run: npm run check:docs
