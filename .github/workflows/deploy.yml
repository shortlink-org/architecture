name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# GITHUB_TOKEN permissions needed to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time; never cancel a run that is mid-deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Requires Pages to be enabled once in the repository:
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      # The `enablement` input is deliberately not used — it needs a PAT,
      # GITHUB_TOKEN cannot create the Pages site.
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Lint catalog
        run: npm run lint

      - name: Build catalog
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
